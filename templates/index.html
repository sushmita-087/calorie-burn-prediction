

<!DOCTYPE html>
<html>
<head>
    <title>Calorie Burn Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input, select {
            width: 90%;
            padding: 10px;
            margin: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: #2878d0;
            color: white;
            padding: 12px;
            width: 90%;
            border: none;
            cursor: pointer;
        }

        h2 {
            color: #2878d0;
        }

        .result {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Calorie Burn Prediction</h2>
    <p>Enter your details below</p>

    <form action="/predict" method="POST">

        <select name="Gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <input type="number" name="Age" placeholder="Age (years)" required>
        <input type="number" step="any" name="Height" placeholder="Height (cm)" required>
        <input type="number" step="any" name="Weight" placeholder="Weight (kg)" required>
        <input type="number" step="any" name="Duration" placeholder="Duration (minutes)" required>
        <input type="number" step="any" name="Heart_Rate" placeholder="Heart Rate" required>
        <input type="number" step="any" name="Body_Temp" placeholder="Body Temperature" required>

        <button type="submit">Predict Calories</button>

    </form>

    {% if prediction is not none %}
        <div class="result">
            <h3>Predicted Calories Burnt: {{ prediction }}</h3>
        </div>
    {% endif %}

</div>

</body>
</html>
